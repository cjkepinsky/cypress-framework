image: cypress/included:15.15.0

stages:
  - test

cache:
  paths:
    - .npm/

cypress_tests:
  stage: test
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check
    - npm run demo:run
  artifacts:
    when: always
    paths:
      - cypress/reports/
      - cypress/videos/**/*.mp4
      - cypress/screenshots/**/*.png
    expire_in: 1 week
